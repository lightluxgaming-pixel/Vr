<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XR House Grab Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;color:#fff;font-family:system-ui,sans-serif}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#101318;z-index:10}#panel{max-width:650px;padding:32px}h1{font-size:40px;margin:0 0 10px}p{opacity:.8;line-height:1.5}button{border:0;border-radius:16px;padding:18px 28px;background:#fff;color:#111;font-size:18px;font-weight:800}#status{margin-top:18px;min-height:24px}#error{margin-top:12px;color:#ff8c8c;white-space:pre-wrap;font-size:14px}</style></head><body><div id="menu"><div id="panel"><h1>XR House Grab Test</h1><p>Passthrough stays visible. A large light-blue box will appear about 1.2 meters in front of you. Your hand tracking is drawn as thin cyan outlines.</p><button id="start">ENTER XR</button><div id="status">Checking XR support…</div><div id="error"></div></div></div><script>'use strict';
const menu=document.getElementById('menu'),start=document.getElementById('start'),status=document.getElementById('status'),error=document.getElementById('error');let session,ref,gl,layer,program,pb,cb,locMVP,locP,locC,box=[0,.18,-1.2],grab=null;const JOINTS=['wrist','thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip','index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip','middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip','ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip','pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip'];const PATHS=[[0,1,2,3,4],[0,5,6,7,8,9],[0,10,11,12,13,14],[0,15,16,17,18,19],[0,20,21,22,23,24]];
start.onclick=enter;init();async function init(){if(!navigator.xr){status.textContent='WebXR is not available in this browser.';start.disabled=true;return}try{let ok=await navigator.xr.isSessionSupported('immersive-ar');status.textContent=ok?'Quest passthrough XR is available.':'immersive-ar is not supported.';start.disabled=!ok}catch(e){status.textContent='XR check failed: '+e.message;start.disabled=true}}
async function enter(){start.disabled=true;error.textContent='';try{session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking','bounded-floor']});gl=document.createElement('canvas').getContext('webgl',{alpha:true,antialias:true,depth:true,stencil:false});await gl.makeXRCompatible();layer=new XRWebGLLayer(session,gl,{alpha:true,antialias:true,depth:true});session.updateRenderState({baseLayer:layer,depthNear:.01,depthFar:100});ref=await session.requestReferenceSpace('local-floor');makeProgram();menu.style.display='none';session.addEventListener('end',()=>location.reload());session.requestAnimationFrame(renderFrame)}catch(e){error.textContent=(e.name||'Error')+': '+(e.message||e);start.disabled=false}}
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}function makeProgram(){const v=shader(gl.VERTEX_SHADER,'attribute vec3 aPosition;attribute vec3 aColor;uniform mat4 uMVP;varying vec3 vColor;void main(){gl_Position=uMVP*vec4(aPosition,1.0);vColor=aColor;}'),f=shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 vColor;void main(){gl_FragColor=vec4(vColor,1.0);}');program=gl.createProgram();gl.attachShader(program,v);gl.attachShader(program,f);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));locMVP=gl.getUniformLocation(program,'uMVP');locP=gl.getAttribLocation(program,'aPosition');locC=gl.getAttribLocation(program,'aColor');pb=gl.createBuffer();cb=gl.createBuffer();gl.useProgram(program);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE)}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}function d(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])}function line(g,a,b,c){g.p.push(...a,...b);g.c.push(...c,...c)}function boxGeo(g,x,y,z,s,c){const h=s/2,v=[[-h,-h,-h],[h,-h,-h],[h,h,-h],[-h,h,-h],[-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h]],f=[[0,1,2],[0,2,3],[4,6,5],[4,7,6],[0,4,5],[0,5,1],[2,6,7],[2,7,3],[0,3,7],[0,7,4],[1,5,6],[1,6,2]];for(const q of f)for(const i of q){g.p.push(v[i][0]+x,v[i][1]+y,v[i][2]+z);g.c.push(...c)}}
function hand(g,p){if(!p[0])return;const c=[.1,.95,1];for(const path of PATHS)for(let i=0;i<path.length-1;i++){const a=p[path[i]],b=p[path[i+1]];if(a&&b)line(g,a,b,c)}for(const p0 of p)if(p0){const s=.008;line(g,[p0[0]-s,p0[1],p0[2]],[p0[0]+s,p0[1],p0[2]],c)}}
function inputs(frame,g){for(const input of session.inputSources){if(!input.hand)continue;const p=JOINTS.map(n=>{const space=input.hand.get(n);const pose=space?frame.getJointPose(space,ref):null;return pose?[pose.transform.position.x,pose.transform.position.y,pose.transform.position.z]:null});hand(g,p);const t=p[4],i=p[9],m=p[14];if(t&&i&&m){const center=[(t[0]+i[0]+m[0])/3,(t[1]+i[1]+m[1])/3,(t[2]+i[2]+m[2])/3],pinch=d(t,i)<.045&&d(t,m)<.06,near=d(center,box)<.30;if(!grab&&pinch&&near)grab={input,offset:[box[0]-center[0],box[1]-center[1],box[2]-center[2]]};if(grab&&grab.input===input){if(pinch)box=[center[0]+grab.offset[0],center[1]+grab.offset[1],center[2]+grab.offset[2]];else grab=null}}}}
function draw(view,g){gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);gl.viewport(view.viewport.x,view.viewport.y,view.viewport.width,view.viewport.height);gl.scissor(view.viewport.x,view.viewport.y,view.viewport.width,view.viewport.height);gl.enable(gl.SCISSOR_TEST);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const vp=mul(view.projectionMatrix,view.transform.inverse.matrix);gl.useProgram(program);gl.uniformMatrix4fv(locMVP,false,vp);gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(g.p),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(locP);gl.vertexAttribPointer(locP,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(g.c),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(locC);gl.vertexAttribPointer(locC,3,gl.FLOAT,false,0,0);const lineCount=g.p.length/3;gl.drawArrays(gl.LINES,0,lineCount);const b={p:[],c:[]};boxGeo(b,box[0],box[1],box[2],.30,[.05,.75,.95]);gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(b.p),gl.DYNAMIC_DRAW);gl.vertexAttribPointer(locP,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(b.c),gl.DYNAMIC_DRAW);gl.vertexAttribPointer(locC,3,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,b.p.length/3)}
function renderFrame(t,frame){const pose=frame.getViewerPose(ref);if(pose){const g={p:[],c:[]};inputs(frame,g);for(const view of pose.views)draw(view,g)}session.requestAnimationFrame(renderFrame)}
</script></body></html>
