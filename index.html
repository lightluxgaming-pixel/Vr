<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Render Test 3</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui}#c{position:fixed;inset:0;width:100%;height:100%}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#111;z-index:2}#p{padding:30px}button{padding:18px 28px;border:0;border-radius:14px;font-size:18px;font-weight:800}</style></head>
<body><canvas id="c"></canvas><div id="menu"><div id="p"><h1>XR Render Test 3</h1><p>XR viewport fix.</p><button id="go">ENTER XR</button><div id="s">Checking…</div></div></div>
<script>'use strict';const canvas=document.getElementById('c'),menu=document.getElementById('menu'),go=document.getElementById('go'),s=document.getElementById('s');let session,space,gl,layer,prog,pbuf,colorLoc;go.onclick=start;(async()=>{try{const ok=!!navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar');s.textContent=ok?'Ready':'immersive-ar unavailable';go.disabled=!ok}catch(e){s.textContent=e.name+': '+e.message;go.disabled=true}})();
async function start(){try{session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor']});gl=canvas.getContext('webgl',{alpha:true,antialias:true,depth:false,stencil:false});if(!gl)throw Error('WebGL unavailable');await gl.makeXRCompatible();layer=new XRWebGLLayer(session,gl,{alpha:true,antialias:true});session.updateRenderState({baseLayer:layer});space=await session.requestReferenceSpace('local-floor');const vs=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(vs,'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}');gl.compileShader(vs);if(!gl.getShaderParameter(vs,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(vs));const fs=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(fs,'precision mediump float;uniform vec4 color;void main(){gl_FragColor=color;}');gl.compileShader(fs);if(!gl.getShaderParameter(fs,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(fs));prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));pbuf=gl.createBuffer();colorLoc=gl.getUniformLocation(prog,'color');gl.bindBuffer(gl.ARRAY_BUFFER,pbuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-0.7,-0.7,0.7,-0.7,0,0.7]),gl.STATIC_DRAW);menu.style.display='none';session.requestAnimationFrame(frame)}catch(e){menu.style.display='grid';s.textContent=e.name+': '+e.message}}
function frame(t,f){try{const pose=f.getViewerPose(space);if(pose){gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);gl.enable(gl.SCISSOR_TEST);for(const v of pose.views){const x=layer.getViewport(v);if(!x)continue;gl.viewport(x.x,x.y,x.width,x.height);gl.scissor(x.x,x.y,x.width,x.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(prog);const a=gl.getAttribLocation(prog,'p');gl.bindBuffer(gl.ARRAY_BUFFER,pbuf);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);gl.uniform4f(colorLoc,0.05,0.8,1,1);gl.drawArrays(gl.TRIANGLES,0,3)}gl.disable(gl.SCISSOR_TEST)}}catch(e){console.error('XR render:',e)}session.requestAnimationFrame(frame)}</script></body></html>
