<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>VR House Sandbox</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html,body { margin:0; min-height:100%; background:#050505; color:#fff; }
    body { display:grid; place-items:center; }
    #start { max-width:720px; padding:28px; text-align:center; }
    button { border:0; border-radius:14px; padding:15px 22px; font:inherit; font-weight:700; cursor:pointer; background:#fff; color:#111; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .muted { opacity:.72; line-height:1.5; }
    #status { min-height:1.5em; margin-top:14px; }
    #hud { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:5; display:none; gap:8px; align-items:center; padding:9px; border-radius:16px; background:rgba(8,8,8,.76); backdrop-filter:blur(10px); }
    #hud button { padding:10px 13px; border-radius:11px; font-size:14px; }
    #hint { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:5; display:none; padding:9px 13px; border-radius:12px; background:rgba(8,8,8,.7); font-size:13px; text-align:center; }
  </style>
</head>
<body>
  <main id="start">
    <h1>VR House Sandbox</h1>
    <p class="muted">Quest Browser prototype: use Space Setup to turn your real room into the play space. Controllers and hand tracking are supported when the browser exposes them.</p>
    <button id="enter" type="button">Enter House Sandbox</button>
    <div id="status" role="status" aria-live="polite">Checking WebXR…</div>
  </main>
  <div id="hud" aria-label="Spawn controls">
    <button data-spawn="cube" type="button">Cube</button>
    <button data-spawn="dummy" type="button">Dummy</button>
    <button data-spawn="blaster" type="button">Blaster</button>
    <button id="clear" type="button">Clear</button>
  </div>
  <div id="hint">Point and press trigger/select to spawn. Pinch can select when hand tracking is active.</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import { XRControllerModelFactory } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/XRControllerModelFactory.js';

    const start = document.querySelector('#start');
    const enter = document.querySelector('#enter');
    const status = document.querySelector('#status');
    const hud = document.querySelector('#hud');
    const hint = document.querySelector('#hint');

    let renderer, scene, camera, session;
    let controller1, controller2;
    let spawnMode = 'cube';
    const spawned = [];
    const dummies = [];
    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();

    function setStatus(text) { status.textContent = text; }

    async function supported(mode) {
      return !!navigator.xr?.isSessionSupported && navigator.xr.isSessionSupported(mode);
    }

    async function init() {
      if (!navigator.xr) {
        setStatus('This browser does not expose WebXR. Open this page in Meta Quest Browser.');
        enter.disabled = true;
        return;
      }
      const ar = await supported('immersive-ar');
      const vr = await supported('immersive-vr');
      if (!ar && !vr) {
        setStatus('Immersive WebXR is not available here.');
        enter.disabled = true;
        return;
      }
      setStatus(ar ? 'Ready — Space Setup / passthrough mode available.' : 'Ready — VR mode available.');
      enter.dataset.mode = ar ? 'immersive-ar' : 'immersive-vr';
    }

    function makeScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, .05, 100);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.6);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 1.5);
      dir.position.set(2, 4, 1);
      scene.add(dir);

      const reticle = new THREE.Mesh(
        new THREE.RingGeometry(.045, .06, 24),
        new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.8 })
      );
      reticle.rotation.x = -Math.PI / 2;
      reticle.position.set(0,0,-1);
      camera.add(reticle);
      scene.add(camera);

      renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      renderer.setSize(innerWidth, innerHeight);
      renderer.xr.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setAnimationLoop(tick);
      document.body.appendChild(renderer.domElement);

      const factory = new XRControllerModelFactory();
      controller1 = renderer.xr.getController(0);
      controller2 = renderer.xr.getController(1);
      for (const c of [controller1, controller2]) {
        c.addEventListener('select', () => spawnAtController(c));
        const grip = renderer.xr.getControllerGrip(c === controller1 ? 0 : 1);
        grip.add(factory.createControllerModel(grip));
        scene.add(grip);
        scene.add(c);
      }

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    }

    function materialFor(kind) {
      if (kind === 'dummy') return new THREE.MeshStandardMaterial({ color:0xb7b7b7, roughness:.8 });
      if (kind === 'blaster') return new THREE.MeshStandardMaterial({ color:0x20252b, metalness:.7, roughness:.3 });
      return new THREE.MeshStandardMaterial({ color:0x5d8cff, roughness:.45 });
    }

    function makeDummy() {
      const g = new THREE.Group();
      const mat = materialFor('dummy');
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(.18,.55,6,12), mat);
      body.position.y = .6;
      g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(.18,16,12), mat);
      head.position.y = 1.15;
      g.add(head);
      for (const x of [-.22,.22]) {
        const limb = new THREE.Mesh(new THREE.CapsuleGeometry(.07,.45,5,8), mat);
        limb.position.set(x,.62,0);
        limb.rotation.z = x > 0 ? -.12 : .12;
        g.add(limb);
      }
      g.userData.kind='dummy';
      g.userData.velocity = new THREE.Vector3();
      g.userData.health = 100;
      return g;
    }

    function makeObject(kind) {
      if (kind === 'dummy') return makeDummy();
      if (kind === 'blaster') {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(.18,.14,.55), materialFor('blaster'));
        g.add(body);
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.28,12), materialFor('blaster'));
        barrel.rotation.x = Math.PI/2;
        barrel.position.z = -.4;
        g.add(barrel);
        g.userData.kind='blaster';
        return g;
      }
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(.25,.25,.25), materialFor('cube'));
      mesh.userData.kind='cube';
      return mesh;
    }

    function spawn(position, quaternion = new THREE.Quaternion()) {
      const obj = makeObject(spawnMode);
      obj.position.copy(position);
      obj.quaternion.copy(quaternion);
      scene.add(obj);
      spawned.push(obj);
      if (obj.userData.kind === 'dummy') dummies.push(obj);
    }

    function spawnAtController(controller) {
      const p = new THREE.Vector3();
      const q = new THREE.Quaternion();
      controller.getWorldPosition(p);
      controller.getWorldQuaternion(q);
      const forward = new THREE.Vector3(0,0,-1).applyQuaternion(q).normalize();
      p.addScaledVector(forward, .75);
      spawn(p, q);
    }

    function clearSpawned() {
      while (spawned.length) {
        const obj = spawned.pop();
        scene.remove(obj);
        const i = dummies.indexOf(obj);
        if (i >= 0) dummies.splice(i,1);
      }
    }

    function tick(_, frame) {
      const dt = Math.min(renderer.xr.getFrame ? .033 : .016, .033);
      const player = renderer.xr.getCamera(camera).position;
      for (const d of dummies) {
        if (!d.parent) continue;
        const toPlayer = new THREE.Vector3().subVectors(player, d.position);
        toPlayer.y = 0;
        if (toPlayer.length() > 1.2) {
          toPlayer.normalize();
          d.userData.velocity.lerp(toPlayer.multiplyScalar(.45), .06);
          d.position.addScaledVector(d.userData.velocity, dt);
          d.rotation.y = Math.atan2(d.userData.velocity.x, d.userData.velocity.z);
        }
      }

      // Keep spawned objects near the floor rather than allowing them to fall forever.
      for (const obj of spawned) {
        if (obj.userData.kind !== 'dummy') {
          obj.position.y = Math.max(.12, obj.position.y);
        }
      }
      renderer.render(scene, camera);
    }

    async function enterXR() {
      enter.disabled = true;
      const mode = enter.dataset.mode || 'immersive-ar';
      try {
        makeScene();
        const options = {
          optionalFeatures: ['local-floor','bounded-floor','hand-tracking','dom-overlay'],
          domOverlay: { root: document.body }
        };
        if (mode === 'immersive-ar') {
          options.requiredFeatures = ['plane-detection'];
          options.optionalFeatures.push('anchors');
        }
        session = await navigator.xr.requestSession(mode, options);
        await renderer.xr.setSession(session);
        session.addEventListener('end', () => {
          hud.style.display='none'; hint.style.display='none'; start.style.display='grid'; enter.disabled=false;
        });
        start.style.display='none';
        hud.style.display='flex'; hint.style.display='block';
        setStatus('');
        // Meta Quest Browser can expose Space Setup planes through plane-detection.
        setTimeout(() => {
          if (session && session.inputSources) {
            // If no planes have appeared, the user can invoke Space Setup from the headset UI.
          }
        }, 2500);
      } catch (err) {
        console.error(err);
        setStatus('Could not start WebXR: ' + (err?.message || err));
        enter.disabled=false;
      }
    }

    document.querySelectorAll('[data-spawn]').forEach(btn => btn.addEventListener('click', () => {
      spawnMode = btn.dataset.spawn;
    }));
    document.querySelector('#clear').addEventListener('click', clearSpawned);
    enter.addEventListener('click', enterXR);
    init();
  </script>
</body>
</html>
