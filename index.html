<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VR House Sandbox</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,sans-serif}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#101318;z-index:10}#panel{max-width:520px;padding:32px}h1{font-size:42px;margin:0 0 10px}p{opacity:.75;line-height:1.5}button{border:0;border-radius:16px;padding:18px 28px;background:#fff;color:#111;font-size:18px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:default}#status{margin-top:18px;min-height:24px}#launched{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:5;padding:12px 20px;border-radius:14px;background:rgba(0,0,0,.72);font-weight:900;letter-spacing:2px;display:none}canvas{display:block}
</style>
</head>
<body>
<div id="menu"><div id="panel"><h1>VR House Sandbox</h1><p>Press the button to enter the game.</p><button id="startBtn" disabled>START GAME</button><div id="status">Checking Quest WebXR…</div></div></div>
<div id="launched">GAME LAUNCHED</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const menu=document.getElementById('menu');
const button=document.getElementById('startBtn');
const status=document.getElementById('status');
const launched=document.getElementById('launched');
let renderer,scene,camera,session;

async function checkXR(){
  if(!navigator.xr){status.textContent='WebXR is not available. Open this page in Meta Quest Browser.';return;}
  try{
    const ok=await navigator.xr.isSessionSupported('immersive-vr');
    if(ok){button.disabled=false;status.textContent='Quest VR is ready.';}
    else status.textContent='Immersive VR is not available on this browser/device.';
  }catch(e){status.textContent='Could not check VR support.';console.error(e);}
}

function buildRoom(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x20252c);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,100);

  scene.add(new THREE.HemisphereLight(0xffffff,0x30343b,1.8));
  const light=new THREE.PointLight(0xffffff,18,12);light.position.set(0,2.8,0);scene.add(light);

  const floor=new THREE.Mesh(new THREE.BoxGeometry(8,.12,8),new THREE.MeshStandardMaterial({color:0x555b63,roughness:.8}));
  floor.position.y=-.06;scene.add(floor);

  const wallMat=new THREE.MeshStandardMaterial({color:0x8b9098,roughness:.9});
  const back=new THREE.Mesh(new THREE.BoxGeometry(8,3,0.12),wallMat);back.position.set(0,1.5,-4);scene.add(back);
  const left=new THREE.Mesh(new THREE.BoxGeometry(.12,3,8),wallMat);left.position.set(-4,1.5,0);scene.add(left);
  const right=new THREE.Mesh(new THREE.BoxGeometry(.12,3,8),wallMat);right.position.set(4,1.5,0);scene.add(right);
  const ceiling=new THREE.Mesh(new THREE.BoxGeometry(8,.12,8),new THREE.MeshStandardMaterial({color:0x6e737a,roughness:1}));ceiling.position.y=3;scene.add(ceiling);

  const tableTop=new THREE.Mesh(new THREE.BoxGeometry(2,.12,1.2),new THREE.MeshStandardMaterial({color:0x6b4b32,roughness:.8}));
  tableTop.position.set(0,1,-1.3);scene.add(tableTop);
  for(const x of[-.8,.8])for(const z of[-1.7,-.9]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.12,1,.12),new THREE.MeshStandardMaterial({color:0x453021}));leg.position.set(x,.5,z);scene.add(leg)}

  const marker=new THREE.Mesh(new THREE.BoxGeometry(1.4,.02,1.4),new THREE.MeshStandardMaterial({color:0x303640}));marker.position.y=.01;scene.add(marker);
}

function onResize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}

async function startGame(){
  button.disabled=true;
  status.textContent='Launching VR…';
  try{
    buildRoom();
    renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
    renderer.setSize(innerWidth,innerHeight);
    renderer.xr.enabled=true;
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // Keep the session request simple: required features are intentionally avoided
    // so Quest Browser can enter the game before we add room/spatial features.
    session=await navigator.xr.requestSession('immersive-vr');
    await renderer.xr.setSession(session);

    menu.style.display='none';
    launched.style.display='block';
    renderer.setAnimationLoop(()=>renderer.render(scene,camera));

    session.addEventListener('end',()=>{
      renderer.setAnimationLoop(null);
      launched.style.display='none';
      menu.style.display='grid';
      button.disabled=false;
      status.textContent='Game ended. Press START GAME to play again.';
    });
  }catch(e){
    console.error('VR launch failed:',e);
    status.textContent='VR launch failed: '+(e.name||e.message||'unknown error');
    button.disabled=false;
  }
}

button.addEventListener('click',startGame);
window.addEventListener('resize',onResize);
checkXR();
</script>
</body>
</html>
