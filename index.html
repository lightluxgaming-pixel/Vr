<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VR House Sandbox</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;color:#fff;font-family:system-ui,sans-serif}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#101318;z-index:10}#panel{max-width:520px;padding:32px}h1{font-size:42px;margin:0 0 10px}p{opacity:.75;line-height:1.5}button{border:0;border-radius:16px;padding:18px 28px;background:#fff;color:#111;font-size:18px;font-weight:800;cursor:pointer}#status{margin-top:18px;min-height:24px}#error{margin-top:12px;color:#ff8c8c;white-space:pre-wrap;font-size:14px}canvas{display:block}
</style>
</head>
<body>
<div id="menu"><div id="panel"><h1>VR House Sandbox</h1><p>Press the button to enter the game.</p><button id="startBtn">START GAME</button><div id="status">Ready.</div><div id="error"></div></div></div>
<script>
'use strict';

const menu=document.getElementById('menu');
const button=document.getElementById('startBtn');
const status=document.getElementById('status');
const errorBox=document.getElementById('error');
let session=null;
let refSpace=null;
let gl=null;
let layer=null;
let program=null;
let positionBuffer=null;
let colorBuffer=null;
let vertexCount=0;
let uVP=null;
let uColor=null;
let objects=[];

button.addEventListener('click',startGame);

function setStatus(text){status.textContent=text;}
function showError(text){errorBox.textContent=text||'';}

async function startGame(){
  button.disabled=true;
  showError('');

  if(!navigator.xr){
    setStatus('WebXR is not available. Open this page in Meta Quest Browser.');
    button.disabled=false;
    return;
  }

  try{
    // No libraries, capability checks, room scans, or heavy scene creation before this call.
    setStatus('Entering VR…');
    session=await navigator.xr.requestSession('immersive-vr');

    const canvas=document.createElement('canvas');
    canvas.width=1;
    canvas.height=1;
    gl=canvas.getContext('webgl',{alpha:false,antialias:false,powerPreference:'low-power'});
    if(!gl) throw new Error('WebGL is unavailable.');

    await gl.makeXRCompatible();
    layer=new XRWebGLLayer(session,gl,{antialias:false});
    session.updateRenderState({baseLayer:layer});

    try{refSpace=await session.requestReferenceSpace('local-floor');}
    catch(_){refSpace=await session.requestReferenceSpace('local');}

    setupRenderer();
    buildRoom();

    menu.style.display='none';
    setStatus('GAME LAUNCHED');
    session.addEventListener('end',onSessionEnd);
    session.requestAnimationFrame(onXRFrame);
  }catch(e){
    console.error(e);
    setStatus('VR launch failed.');
    showError((e&&e.name?e.name+': ':'')+(e&&e.message?e.message:'Unknown WebXR error'));
    button.disabled=false;
    if(session){try{await session.end();}catch(_){} session=null;}
  }
}

function compile(type,source){
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);
  gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader)||'Shader compile failed.');
  return shader;
}

function setupRenderer(){
  const vs=compile(gl.VERTEX_SHADER,`attribute vec3 aPosition; attribute vec3 aColor; uniform mat4 uVP; varying vec3 vColor; void main(){gl_Position=uVP*vec4(aPosition,1.0);vColor=aColor;}`);
  const fs=compile(gl.FRAGMENT_SHADER,`precision mediump float; varying vec3 vColor; uniform vec4 uColor; void main(){gl_FragColor=vec4(vColor,1.0)*uColor;}`);
  program=gl.createProgram();
  gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program)||'Shader link failed.');
  gl.deleteShader(vs);gl.deleteShader(fs);

  gl.useProgram(program);
  positionBuffer=gl.createBuffer();
  colorBuffer=gl.createBuffer();
  uVP=gl.getUniformLocation(program,'uVP');
  uColor=gl.getUniformLocation(program,'uColor');
  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
}

function addBox(x,y,z,sx,sy,sz,color){
  const hx=sx/2,hy=sy/2,hz=sz/2;
  const p=[
    -hx,-hy,-hz, hx,-hy,-hz, hx,hy,-hz,  -hx,-hy,-hz, hx,hy,-hz, -hx,hy,-hz,
    -hx,-hy,hz, -hx,hy,hz, hx,hy,hz,  -hx,-hy,hz, hx,hy,hz, hx,-hy,hz,
    -hx,-hy,-hz, -hx,hy,-hz, -hx,hy,hz,  -hx,-hy,-hz, -hx,hy,hz, -hx,-hy,hz,
    hx,-hy,-hz, hx,-hy,hz, hx,hy,hz,  hx,-hy,-hz, hx,hy,hz, hx,hy,-hz,
    -hx,hy,-hz, hx,hy,-hz, hx,hy,hz,  -hx,hy,-hz, hx,hy,hz, -hx,hy,hz,
    -hx,-hy,-hz, -hx,-hy,hz, hx,-hy,hz,  -hx,-hy,-hz, hx,-hy,hz, hx,-hy,-hz
  ];
  for(let i=0;i<p.length;i+=3){p[i]+=x;p[i+1]+=y;p[i+2]+=z;}
  const c=[];for(let i=0;i<36;i++)c.push(color[0],color[1],color[2]);
  objects.push({p,c});
}

function buildRoom(){
  objects=[];
  // Small default room: floor, three walls, ceiling, and a simple table.
  addBox(0,-0.05,0,6,0.1,6,[0.28,0.31,0.35]);
  addBox(0,1.5,-3,6,3,0.1,[0.48,0.50,0.54]);
  addBox(-3,1.5,0,0.1,3,6,[0.42,0.44,0.48]);
  addBox(3,1.5,0,0.1,3,6,[0.42,0.44,0.48]);
  addBox(0,3,0,6,0.1,6,[0.34,0.36,0.40]);
  addBox(0,1.0,-1.0,2.0,0.12,1.2,[0.38,0.22,0.12]);
  addBox(-0.85,0.5,-1.45,0.12,1.0,0.12,[0.25,0.14,0.08]);
  addBox(0.85,0.5,-1.45,0.12,1.0,0.12,[0.25,0.14,0.08]);
  addBox(-0.85,0.5,-0.55,0.12,1.0,0.12,[0.25,0.14,0.08]);
  addBox(0.85,0.5,-0.55,0.12,1.0,0.12,[0.25,0.14,0.08]);
}

function drawBox(obj,vp){
  gl.bindBuffer(gl.ARRAY_BUFFER,positionBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(obj.p),gl.STREAM_DRAW);
  const aPosition=gl.getAttribLocation(program,'aPosition');
  gl.enableVertexAttribArray(aPosition);gl.vertexAttribPointer(aPosition,3,gl.FLOAT,false,0,0);

  gl.bindBuffer(gl.ARRAY_BUFFER,colorBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(obj.c),gl.STREAM_DRAW);
  const aColor=gl.getAttribLocation(program,'aColor');
  gl.enableVertexAttribArray(aColor);gl.vertexAttribPointer(aColor,3,gl.FLOAT,false,0,0);

  gl.uniformMatrix4fv(uVP,false,vp);
  gl.uniform4f(uColor,1,1,1,1);
  gl.drawArrays(gl.TRIANGLES,0,36);
}

function onXRFrame(time,frame){
  const s=frame.session;
  const pose=frame.getViewerPose(refSpace);
  if(pose){
    gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);
    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(0.055,0.07,0.09,1);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    for(const view of pose.views){
      const viewport=layer.getViewport(view);
      gl.viewport(viewport.x,viewport.y,viewport.width,viewport.height);
      gl.clear(gl.DEPTH_BUFFER_BIT);
      for(const obj of objects)drawBox(obj,multiply4(view.projectionMatrix,view.transform.inverse.matrix));
    }
  }
  s.requestAnimationFrame(onXRFrame);
}

function multiply4(a,b){
  const out=new Float32Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++)out[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
  return out;
}

function onSessionEnd(){
  session=null;
  menu.style.display='grid';
  button.disabled=false;
  setStatus('Game ended. Press START GAME to play again.');
  showError('');
}
</script>
</body>
</html>
