<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Hand and Controller Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui}#c{position:fixed;inset:0;width:100%;height:100%}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#111;z-index:2}#p{padding:30px}button{padding:18px 28px;border:0;border-radius:14px;font-size:18px;font-weight:800}</style></head><body><canvas id="c"></canvas><div id="menu"><div id="p"><h1>XR Grab Test</h1><p>Passthrough + hand outlines + controller outlines + grab.</p><button id="go">ENTER XR</button><div id="s">Checking…</div></div></div><script>'use strict';const canvas=document.getElementById('c'),menu=document.getElementById('menu'),go=document.getElementById('go'),status=document.getElementById('s');let session,space,gl,layer,prog,posBuf,colorLoc,mvpLoc,attrLoc,boxPos=null,grab=null,boxReady=false;const chains=[['wrist','thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip'],['wrist','index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip'],['wrist','middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip'],['wrist','ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip'],['wrist','pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip']];go.onclick=start;(async()=>{try{const ok=!!navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar');status.textContent=ok?'Ready':'immersive-ar unavailable';go.disabled=!ok}catch(e){status.textContent=e.message;go.disabled=true}})();function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}function start(){return navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking']}).then(async s=>{session=s;gl=canvas.getContext('webgl',{alpha:true,antialias:true,depth:true});await gl.makeXRCompatible();layer=new XRWebGLLayer(session,gl,{alpha:true,antialias:true,depth:true});session.updateRenderState({baseLayer:layer});space=await session.requestReferenceSpace('local-floor');const vs=sh(gl.VERTEX_SHADER,'attribute vec3 p;uniform mat4 mvp;void main(){gl_Position=mvp*vec4(p,1.0);}'),fs=sh(gl.FRAGMENT_SHADER,'precision mediump float;uniform vec4 color;void main(){gl_FragColor=color;}');prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));posBuf=gl.createBuffer();colorLoc=gl.getUniformLocation(prog,'color');mvpLoc=gl.getUniformLocation(prog,'mvp');attrLoc=gl.getAttribLocation(prog,'p');menu.style.display='none';session.requestAnimationFrame(frame)}).catch(e=>{menu.style.display='grid';status.textContent=e.name+': '+e.message});}function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}function draw(view,verts,mode,color){gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STREAM_DRAW);gl.vertexAttribPointer(attrLoc,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(attrLoc);const m=mul(view.projectionMatrix,view.transform.inverse.matrix);gl.uniformMatrix4fv(mvpLoc,false,m);gl.uniform4f(colorLoc,color[0],color[1],color[2],color[3]);gl.drawArrays(mode,0,verts.length/3)}function line(view,a,b,color){draw(view,[a.x,a.y,a.z,b.x,b.y,b.z],gl.LINES,color)}function qrot(q,v){const x=q.x,y=q.y,z=q.z,w=q.w,tx=2*(y*v.z-z*v.y),ty=2*(z*v.x-x*v.z),tz=2*(x*v.y-y*v.x);return{x:v.x+w*tx+(y*tz-z*ty),y:v.y+w*ty+(z*tx-x*tz),z:v.z+w*tz+(x*ty-y*tx)}}function tr(t,q,p){const r=qrot(q,p);return{x:t.x+r.x,y:t.y+r.y,z:t.z+r.z}}function cube(view){if(!boxPos)return;const[x,y,z]=boxPos,h=.16,v=[x-h,y-h,z-h,x+h,y-h,z-h,x+h,y+h,z-h,x-h,y+h,z-h,x-h,y-h,z+h,x+h,y-h,z+h,x+h,y+h,z+h,x-h,y+h,z+h],e=[0,1,1,2,2,3,3,0,4,5,5,6,6,7,7,4,0,4,1,5,2,6,3,7],out=[];for(const i of e)out.push(...v.slice(i*3,i*3+3));draw(view,out,gl.LINES,grab?[1,.75,.05,1]:[.3,.85,1,1])}function hand(view,frame,src){if(!src.hand)return;for(const chain of chains)for(let i=1;i<chain.length;i++){const a=frame.getJointPose(src.hand.get(chain[i-1]),space),b=frame.getJointPose(src.hand.get(chain[i]),space);if(a&&b)line(view,a.transform.position,b.transform.position,[.2,1,1,1])}const tp=frame.getJointPose(src.hand.get('thumb-tip'),space),ip=frame.getJointPose(src.hand.get('index-finger-tip'),space);if(tp&&ip){const a=tp.transform.position,b=ip.transform.position,mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:(a.z+b.z)/2},pinch=d(a,b)<.045;if(pinch&&!grab&&boxPos&&d(mid,{x:boxPos[0],y:boxPos[1],z:boxPos[2]})<.4)grab={src,off:[boxPos[0]-mid.x,boxPos[1]-mid.y,boxPos[2]-mid.z]};if(grab&&grab.src===src){if(pinch)boxPos=[mid.x+grab.off[0],mid.y+grab.off[1],mid.z+grab.off[2]];else grab=null}}}function controller(view,frame,src){if(!src.gripSpace)return;const p=frame.getPose(src.gripSpace,space);if(!p)return;const t=p.transform.position,q=p.transform.orientation;const pts=[[-.055,-.09,-.035],[.055,-.09,-.035],[.075,.05,-.035],[-.075,.05,-.035],[-.055,-.09,.055],[.055,-.09,.055],[.075,.05,.055],[-.075,.05,.055]].map(v=>tr(t,q,{x:v[0],y:v[1],z:v[2]})),edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]],out=[];for(const e of edges)out.push(...[pts[e[0]].x,pts[e[0]].y,pts[e[0]].z,pts[e[1]].x,pts[e[1]].y,pts[e[1]].z]);draw(view,out,gl.LINES,[1,.65,.15,1])}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z)}function frame(t,f){try{const pose=f.getViewerPose(space);if(pose){if(!boxReady){const vp=pose.views[0],p=vp.transform.position,q=vp.transform.orientation,front=qrot(q,{x:0,y:0,z:-1});boxPos=[p.x+front.x*1.0,p.y+front.y*1.0,p.z+front.z*1.0];boxReady=true}gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);gl.enable(gl.SCISSOR_TEST);gl.useProgram(prog);for(const view of pose.views){const vp=layer.getViewport(view);gl.viewport(vp.x,vp.y,vp.width,vp.height);gl.scissor(vp.x,vp.y,vp.width,vp.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);cube(view);for(const src of session.inputSources){hand(view,f,src);controller(view,f,src)}}gl.disable(gl.SCISSOR_TEST)}}catch(e){console.error(e)}session.requestAnimationFrame(frame)}</script></body></html>
