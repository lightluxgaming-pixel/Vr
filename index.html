<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XR Grab Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;color:#fff;font-family:system-ui,sans-serif}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#101318;z-index:10}#panel{max-width:620px;padding:32px}h1{font-size:42px;margin:0 0 10px}p{opacity:.8;line-height:1.5}button{border:0;border-radius:16px;padding:18px 28px;background:#fff;color:#111;font-size:18px;font-weight:800}#status{margin-top:18px;min-height:24px}#error{margin-top:12px;color:#ff8c8c;white-space:pre-wrap;font-size:14px}</style></head><body><div id="menu"><div id="panel"><h1>XR Grab Test</h1><p>Light-blue box stays. Hands are outline-only. Pinch near the box to grab it, then open your hand to release it.</p><button id="start">ENTER XR</button><div id="status">Checking XR support…</div><div id="error"></div></div></div><script>'use strict';
const menu=document.getElementById('menu'),btn=document.getElementById('start'),status=document.getElementById('status'),err=document.getElementById('error');let session,ref,gl,layer,program,posBuf,colBuf,uMVP,ap,ac;let box=[0,.16,-1.2],grab=null;const J=['wrist','thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip','index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip','middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip','ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip','pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip'];const F=[[0,1,2,3,4],[0,5,6,7,8,9],[0,10,11,12,13,14],[0,15,16,17,18,19],[0,20,21,22,23,24]];btn.onclick=start;check();async function check(){if(!navigator.xr){status.textContent='WebXR unavailable';btn.disabled=true;return}try{let ok=await navigator.xr.isSessionSupported('immersive-ar');status.textContent=ok?'Passthrough XR ready.':'Passthrough XR unavailable.';btn.disabled=!ok}catch(e){status.textContent='XR support check failed.'}}
async function start(){btn.disabled=true;try{session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking']});gl=document.createElement('canvas').getContext('webgl',{alpha:true,antialias:true});await gl.makeXRCompatible();layer=new XRWebGLLayer(session,gl,{alpha:true,antialias:true});session.updateRenderState({baseLayer:layer,depthNear:.01,depthFar:100});ref=await session.requestReferenceSpace('local-floor');setup();menu.style.display='none';session.addEventListener('end',()=>location.reload());session.requestAnimationFrame(frame)}catch(e){err.textContent=(e.name||'Error')+': '+(e.message||e);btn.disabled=false}}
function shader(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}function setup(){let v=shader(gl.VERTEX_SHADER,'attribute vec3 p;attribute vec3 c;uniform mat4 mvp;varying vec3 q;void main(){gl_Position=mvp*vec4(p,1.0);q=c;}'),f=shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 q;void main(){gl_FragColor=vec4(q,1.0);}');program=gl.createProgram();gl.attachShader(program,v);gl.attachShader(program,f);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));uMVP=gl.getUniformLocation(program,'mvp');ap=gl.getAttribLocation(program,'p');ac=gl.getAttribLocation(program,'c');posBuf=gl.createBuffer();colBuf=gl.createBuffer();gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE)}
function mul(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function line(d,a,b,c){d.p.push(...a,...b);d.c.push(...c,...c)}function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])}function addBox(d,x,y,z,s,c){let h=s/2,a=[[-h,-h,-h],[h,-h,-h],[h,h,-h],[-h,h,-h],[-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h]],q=[[0,1,2],[0,2,3],[4,6,5],[4,7,6],[0,4,5],[0,5,1],[2,6,7],[2,7,3],[0,3,7],[0,7,4],[1,5,6],[1,6,2]];for(const face of q)for(const k of face){d.p.push(a[k][0]+x,a[k][1]+y,a[k][2]+z);d.c.push(...c)}}
function handOutline(d,p){if(!p[0])return;let c=[.15,.9,1];for(const path of F)for(let i=0;i<path.length-1;i++){if(p[path[i]]&&p[path[i+1]])line(d,p[path[i]],p[path[i+1]],c)}for(let i=0;i<p.length;i++)if(p[i]){let s=.006;line(d,[p[i][0]-s,p[i][1],p[i][2]],[p[i][0]+s,p[i][1],p[i][2]],c)}}
function inputGeometry(frame){let d={p:[],c:[]};for(const input of session.inputSources){if(!input.hand)continue;let p=J.map(n=>{let sp=input.hand.get(n),po=sp&&frame.getJointPose(sp,ref);return po?[po.transform.position.x,po.transform.position.y,po.transform.position.z]:null});handOutline(d,p);let t=p[4],i=p[9],m=p[14];if(t&&i&&m){let center=[(t[0]+i[0]+m[0])/3,(t[1]+i[1]+m[1])/3,(t[2]+i[2]+m[2])/3],pinch=dist(t,i)<.045&&dist(t,m)<.06,near=dist(center,box)<.28;if(pinch&&near&&!grab)grab={input,offset:[box[0]-center[0],box[1]-center[1],box[2]-center[2]]};if(grab&&grab.input===input){if(pinch)box=[center[0]+grab.offset[0],center[1]+grab.offset[1],center[2]+grab.offset[2]];else grab=null}}}return d}
function render(frame,view,d){let data={p:[...d.p],c:[...d.c]};addBox(data,box[0],box[1],box[2],.30,[.05,.75,.95]);gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);gl.viewport(view.viewport.x,view.viewport.y,view.viewport.width,view.viewport.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let vp=mul(view.projectionMatrix,view.viewMatrix);gl.useProgram(program);gl.uniformMatrix4fv(uMVP,false,vp);gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.p),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,colBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.c),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(ac);gl.vertexAttribPointer(ac,3,gl.FLOAT,false,0,0);gl.drawArrays(gl.LINES,0,d.p.length/3);gl.drawArrays(gl.TRIANGLES,d.p.length/3,(data.p.length-d.p.length)/3)}
function frame(t,f){let pose=f.getViewerPose(ref);if(pose){let d=inputGeometry(f);for(const v of pose.views)render(f,v,d)}session.requestAnimationFrame(frame)}
</script></body></html>
