<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XR Grab Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;color:white;font-family:system-ui,sans-serif}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#101318;z-index:10}#panel{max-width:620px;padding:32px}h1{font-size:42px;margin:0 0 10px}p{opacity:.8;line-height:1.5}button{border:0;border-radius:16px;padding:18px 28px;background:white;color:#111;font-size:18px;font-weight:800}#status{margin-top:18px;min-height:24px}#error{margin-top:12px;color:#ff8c8c;white-space:pre-wrap;font-size:14px}</style></head><body><div id="menu"><div id="panel"><h1>XR Grab Test</h1><p>Light-blue box stays. Hands are outlines only. Close your hand around the box to grab it, then open your hand to release it.</p><button id="start">ENTER XR</button><div id="status">Checking XR support…</div><div id="error"></div></div></div><script>'use strict';
const menu=document.getElementById('menu'),btn=document.getElementById('start'),status=document.getElementById('status'),err=document.getElementById('error');let session,ref,gl,layer,program,buf,col,uVP;let box=[0,.16,-1.2],grab=null;const J=['wrist','thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip','index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip','middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip','ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip','pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip'];const F=[[0,1,2,3,4],[0,5,6,7,8,9],[0,10,11,12,13,14],[0,15,16,17,18,19],[0,20,21,22,23,24]];btn.onclick=start;check();async function check(){if(!navigator.xr){status.textContent='WebXR unavailable';btn.disabled=true;return}try{const ok=await navigator.xr.isSessionSupported('immersive-ar');status.textContent=ok?'Passthrough XR ready.':'Passthrough XR unavailable.';btn.disabled=!ok}catch(e){status.textContent='XR support check failed.'}}
async function start(){btn.disabled=true;try{session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking']});gl=document.createElement('canvas').getContext('webgl',{alpha:true,antialias:true});await gl.makeXRCompatible();layer=new XRWebGLLayer(session,gl,{alpha:true,antialias:true});session.updateRenderState({baseLayer:layer,depthNear:.01,depthFar:100});ref=await session.requestReferenceSpace('local-floor');setup();menu.style.display='none';session.addEventListener('end',()=>location.reload());session.requestAnimationFrame(frame)}catch(e){err.textContent=(e.name||'Error')+': '+(e.message||e);btn.disabled=false}}
function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}function setup(){let v=sh(gl.VERTEX_SHADER,'attribute vec3 p;attribute vec3 c;uniform mat4 m;varying vec3 q;void main(){gl_Position=m*vec4(p,1.);q=c;}'),f=sh(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 q;void main(){gl_FragColor=vec4(q,1.);}');program=gl.createProgram();gl.attachShader(program,v);gl.attachShader(program,f);gl.linkProgram(program);uVP=gl.getUniformLocation(program,'m');buf=gl.createBuffer();col=gl.createBuffer();gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.enable(gl.SCISSOR_TEST)}
function addBox(d,x,y,z,s,c){let h=s/2,a=[[-h,-h,-h],[h,-h,-h],[h,h,-h],[-h,h,-h],[-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h]],q=[[0,1,2],[0,2,3],[4,6,5],[4,7,6],[0,4,5],[0,5,1],[2,6,7],[2,7,3],[0,3,7],[0,7,4],[1,5,6],[1,6,2]];for(let zt of q)for(let k of zt){let p=a[k];d.p.push(p[0]+x,p[1]+y,p[2]+z);d.c.push(...c)}}
function line(d,a,b,c){d.p.push(...a,...b);d.c.push(...c,...c)}function tp(m,p){return[m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]]}function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])}
function handOutline(d,pts){if(!pts[0])return;const c=[1,.75,.25];for(const path of F)for(let i=0;i<path.length-1;i++){const a=pts[path[i]],b=pts[path[i+1]];if(a&&b)line(d,a,b,c)}for(let i=0;i<pts.length;i++)if(pts[i]){let s=.008;line(d,[pts[i][0]-s,pts[i][1],pts[i][2]],[pts[i][0]+s,pts[i][1],pts[i][2]],c);line(d,[pts[i][0],pts[i][1]-s,pts[i][2]],[pts[i][0],pts[i][1]+s,pts[i][2]],c)}}
function handData(frame){let d={p:[],c:[]};for(const input of session.inputSources){if(!input.hand)continue;let pts=J.map(n=>{let sp=input.hand.get(n),po=sp&&frame.getJointPose(sp,ref);return po? [po.transform.position.x,po.transform.position.y,po.transform.position.z]:null});handOutline(d,pts);const palm=pts[0],thumb=pts[4],index=pts[9],middle=pts[14];if(palm&&thumb&&index&&middle){let center=[(palm[0]+thumb[0]+index[0]+middle[0])/4,(palm[1]+thumb[1]+index[1]+middle[1])/4,(palm[2]+thumb[2]+index[2]+middle[2])/4];let closed=dist(thumb,index)<.045&&dist(thumb,middle)<.055;let near=dist(center,box)<.22;if(closed&&near&&!grab)grab={input,offset:[box[0]-center[0],box[1]-center[1],box[2]-center[2]]};if(grab&&grab.input===input){if(closed){box=[center[0]+grab.offset[0],center[1]+grab.offset[1],center[2]+grab.offset[2]]}else grab=null}}}return d}
function draw(frame,view,d){gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);gl.viewport(view.viewport.x,view.viewport.y,view.viewport.width,view.viewport.height);gl.scissor(view.viewport.x,view.viewport.y,view.viewport.width,view.viewport.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);gl.uniformMatrix4fv(uVP,false,view.projectionMatrix);let vp=view.viewMatrix;let verts=[];for(let i=0;i<d.p.length;i+=3){let p=d.p.slice(i,i+3);let x=vp[0]*p[0]+vp[4]*p[1]+vp[8]*p[2]+vp[12],y=vp[1]*p[0]+vp[5]*p[1]+vp[9]*p[2]+vp[13],z=vp[2]*p[0]+vp[6]*p[1]+vp[10]*p[2]+vp[14];verts.push(x,y,z)}gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.DYNAMIC_DRAW);let ap=gl.getAttribLocation(program,'p'),ac=gl.getAttribLocation(program,'c');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,col);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d.c),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(ac);gl.vertexAttribPointer(ac,3,gl.FLOAT,false,0,0);gl.uniformMatrix4fv(uVP,false,view.projectionMatrix);gl.drawArrays(gl.LINES,0,d.p.length/3);let b={p:[],c:[]};addBox(b,box[0],box[1],box[2],.30,[.05,.75,.95]);gl.bindBuffer(gl.ARRAY_BUFFER,buf);let bp=[];for(let i=0;i<b.p.length;i+=3){let p=b.p.slice(i,i+3),x=vp[0]*p[0]+vp[4]*p[1]+vp[8]*p[2]+vp[12],y=vp[1]*p[0]+vp[5]*p[1]+vp[9]*p[2]+vp[13],z=vp[2]*p[0]+vp[6]*p[1]+vp[10]*p[2]+vp[14];bp.push(x,y,z)}gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(bp),gl.DYNAMIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,col);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(b.c),gl.DYNAMIC_DRAW);gl.vertexAttribPointer(ac,3,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,b.p.length/3)}
function frame(t,f){const pose=f.getViewerPose(ref);if(!pose){session.requestAnimationFrame(frame);return}const d=handData(f);for(const v of pose.views)draw(f,v,d);session.requestAnimationFrame(frame)}
</script></body></html>
