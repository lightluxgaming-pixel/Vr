<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THERE IS NO GAME — VR Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0e;color:#fff;font-family:system-ui,Arial}
canvas{display:block}#menu{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(ellipse at center,#20232b,#08090d 70%);text-align:center}#card{max-width:680px;padding:28px}h1{font-size:clamp(34px,8vw,76px);letter-spacing:.08em;margin:0 0 8px}p{opacity:.78;line-height:1.5}button{font-size:20px;font-weight:900;padding:14px 25px;border:1px solid #aeb3c0;border-radius:8px;background:#e7e9ef;color:#111;cursor:pointer}#status{font-size:13px;opacity:.7}#subtitle{position:fixed;bottom:8%;left:10%;right:10%;z-index:3;text-align:center;font-size:clamp(18px,3vw,30px);font-weight:700;text-shadow:0 3px 12px #000;pointer-events:none}#hint{position:fixed;top:12px;left:14px;z-index:3;font-size:13px;opacity:.7;pointer-events:none}
</style>
</head>
<body>
<div id="menu"><div id="card"><h1>THERE IS NO GAME</h1><p>A VR experiment in which absolutely nothing is happening.<br>Definitely do not touch anything.</p><button id="enter">ENTER THE NON-GAME</button><p id="status">Checking immersive VR support…</p></div></div>
<div id="hint">VR PROTOTYPE • PHYSICAL INTERACTION TEST</div><div id="subtitle"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const menu=document.querySelector('#menu'),enter=document.querySelector('#enter'),status=document.querySelector('#status'),subtitle=document.querySelector('#subtitle');
let renderer,scene,camera,session,controllers=[],selectable=[],held=new Map(),started=false,pressCount=0,lastTime=performance.now();
let puzzleRevealed=false,puzzleSolved=false,puzzleCube=null,puzzleSocket=null;
const raycaster=new THREE.Raycaster();
function material(color,roughness=.8,metalness=0){return new THREE.MeshStandardMaterial({color,roughness,metalness})}
function box(w,h,d,color){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color))}
function labelTexture(text,opts={}){const c=document.createElement('canvas');c.width=1024;c.height=256;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle=opts.color||'#f3f3f3';x.textAlign='center';x.textBaseline='middle';x.font='900 '+(opts.size||100)+'px Arial';x.fillText(text,512,128);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function textPanel(text,w,h,size=70,color='#f3f3f3'){const m=new THREE.MeshBasicMaterial({map:labelTexture(text,{size,color}),transparent:true,side:THREE.DoubleSide,depthWrite:false});const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);return o}
function say(text){subtitle.textContent=text;clearTimeout(say.timer);say.timer=setTimeout(()=>subtitle.textContent='',4600);if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1.02;u.pitch=.92;speechSynthesis.speak(u)}}
function addRoom(){scene.background=new THREE.Color(0x11131a);scene.fog=new THREE.Fog(0x11131a,9,24);const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,24),material(0x292b31));floor.rotation.x=-Math.PI/2;floor.position.y=0;scene.add(floor);const grid=new THREE.GridHelper(24,24,0x555966,0x383b45);grid.position.y=.006;scene.add(grid);const back=new THREE.Mesh(new THREE.PlaneGeometry(24,9),material(0x20232b));back.position.set(0,4.5,-8);scene.add(back);const left=new THREE.Mesh(new THREE.PlaneGeometry(16,9),material(0x191c23));left.rotation.y=Math.PI/2;left.position.set(-8,4.5,0);scene.add(left);const right=new THREE.Mesh(new THREE.PlaneGeometry(16,9),material(0x191c23));right.rotation.y=-Math.PI/2;right.position.set(8,4.5,0);scene.add(right);const hemi=new THREE.HemisphereLight(0xdde5ff,0x28202b,2.1);scene.add(hemi);const key=new THREE.DirectionalLight(0xffe4c5,2.4);key.position.set(-3,7,4);scene.add(key);const rim=new THREE.PointLight(0x778bff,22,12);rim.position.set(0,4,-5);scene.add(rim)}
function makeInteractable(mesh,name,onUse){mesh.userData.name=name;mesh.userData.onUse=onUse;mesh.userData.grabbable=true;scene.add(mesh);selectable.push(mesh);return mesh}
function addTitle(){const panel=box(5.6,2.7,.18,0x090a0e);panel.position.set(0,3.1,-5.7);scene.add(panel);const title=textPanel('THERE IS NO GAME',4.9,.65,104);title.position.set(0,3.65,-5.59);scene.add(title);const sub=textPanel('A COMPLETELY POINTLESS VR EXPERIENCE',4.4,.25,38,'#aeb5c8');sub.position.set(0,3.12,-5.58);scene.add(sub);const button=box(1.35,.38,.24,0xbfc5d2);button.position.set(0,2.28,-5.42);makeInteractable(button,'the forbidden button',()=>{pressCount++;button.position.z=-5.25;button.material.color.set(pressCount===1?0xff4444:0xffb52e);say(pressCount===1?'Oh. You found the button. That was not meant for you.':'Stop pressing it. I am begging you.');if(pressCount>=2)revealPuzzle()});const bt=textPanel('DO NOT PRESS',1.15,.19,48,'#17191f');bt.position.set(0,2.28,-5.28);scene.add(bt);const note=textPanel('PLEASE KEEP YOUR HANDS TO YOURSELF',3.4,.2,35,'#9aa1b2');note.position.set(0,1.72,-5.58);scene.add(note)}
function revealPuzzle(){if(puzzleRevealed)return;puzzleRevealed=true;say('Fine. If you insist on interacting, move the suspicious cube onto the glowing platform. It is not a test.');
const pedestal=box(1.05,.22,1.05,0x343b49);pedestal.position.set(0,.16,-3.65);scene.add(pedestal);
puzzleSocket=new THREE.Group();puzzleSocket.position.set(0,.28,-3.65);const ring=new THREE.Mesh(new THREE.TorusGeometry(.43,.035,10,40),new THREE.MeshStandardMaterial({color:0x6f9dff,emissive:0x263f91,emissiveIntensity:1.4,metalness:.35,roughness:.3}));ring.rotation.x=Math.PI/2;puzzleSocket.add(ring);const core=new THREE.Mesh(new THREE.CircleGeometry(.35,32),new THREE.MeshBasicMaterial({color:0x263b67,transparent:true,opacity:.55,side:THREE.DoubleSide}));core.rotation.x=-Math.PI/2;core.position.y=.006;puzzleSocket.add(core);scene.add(puzzleSocket);
puzzleCube=box(.65,.65,.65,0x8b9ac0);puzzleCube.position.set(-1.35,1.05,-3.3);makeInteractable(puzzleCube,'suspicious cube');
const sphere=new THREE.Mesh(new THREE.SphereGeometry(.34,24,16),material(0xc88c55));sphere.position.set(1.2,1.0,-3.5);makeInteractable(sphere,'mysterious sphere',()=>say('That is a sphere. It is not the answer. I checked.'));
const sign=textPanel('PLACE THE CUBE ON THE GLOWING PLATFORM',4.4,.36,54,'#dce4ff');sign.position.set(0,2.45,-4.5);scene.add(sign);
const hint=textPanel('TRIGGER TO GRAB • RELEASE TO THROW',3.5,.22,34,'#aeb8d7');hint.position.set(0,2.08,-4.5);scene.add(hint);
}
function makeHand(controller,index){const palm=new THREE.Mesh(new THREE.SphereGeometry(.075,12,10),material(index===0?0xd2a98e:0xb88f78));palm.position.set(0,-.02,-.12);controller.add(palm);for(let i=0;i<4;i++){const finger=new THREE.Mesh(new THREE.CapsuleGeometry(.018,.075,3,6),material(0xc9a187));finger.position.set((i-1.5)*.035,-.025,-.22);finger.rotation.x=-.2;controller.add(finger)}const thumb=new THREE.Mesh(new THREE.CapsuleGeometry(.02,.07,3,6),material(0xc9a187));thumb.position.set(index===0?-.09:.09,-.035,-.14);thumb.rotation.z=index===0?-.8:.8;controller.add(thumb)}
function initControllers(){for(let i=0;i<2;i++){const c=renderer.xr.getController(i);c.userData.index=i;makeHand(c,i);const ray=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:i===0?0xb2a0ff:0x8fe7ff,transparent:true,opacity:.65}));ray.scale.z=4;c.add(ray);c.addEventListener('selectstart',()=>selectStart(c));c.addEventListener('selectend',()=>selectEnd(c));scene.add(c);controllers.push(c)}}
function hitFromController(c){const p=new THREE.Vector3(),q=new THREE.Quaternion();c.getWorldPosition(p);c.getWorldQuaternion(q);raycaster.set(p,new THREE.Vector3(0,0,-1).applyQuaternion(q));raycaster.far=8;const hits=raycaster.intersectObjects(selectable,true);if(!hits.length)return null;let obj=hits[0].object;while(obj&&!obj.userData.grabbable)obj=obj.parent;return obj||null}
function selectStart(c){const obj=hitFromController(c);if(!obj)return;if(obj.userData.onUse){obj.userData.onUse();return}if(obj.userData.grabbable){const worldPos=obj.getWorldPosition(new THREE.Vector3());const worldQuat=obj.getWorldQuaternion(new THREE.Quaternion());scene.attach(obj);c.attach(obj);obj.position.set(0,0,-.48);obj.quaternion.identity();held.set(c,{obj,last:c.getWorldPosition(new THREE.Vector3()),velocity:new THREE.Vector3()});say('Picked up '+obj.userData.name+'. Try not to drop the plot.');}}
function selectEnd(c){const state=held.get(c);if(!state)return;const obj=state.obj;const worldPos=obj.getWorldPosition(new THREE.Vector3()),worldQuat=obj.getWorldQuaternion(new THREE.Quaternion());scene.attach(obj);obj.position.copy(worldPos);obj.quaternion.copy(worldQuat);obj.userData.velocity=state.velocity.clone().multiplyScalar(1.15);if(obj.userData.velocity.length()>5.5)obj.userData.velocity.setLength(5.5);held.delete(c);if(obj===puzzleCube&&!puzzleSolved)say('Excellent. The cube has been released. Gravity is now in charge.');}
function updateHeldMotion(dt){for(const [c,state] of held){const now=c.getWorldPosition(new THREE.Vector3());state.velocity.copy(now).sub(state.last).multiplyScalar(1/Math.max(dt,.001));state.last.copy(now);}}
function updatePhysics(dt){for(const obj of selectable){if([...held.values()].some(s=>s.obj===obj)||obj.userData.locked)continue;if(obj.userData.velocity){obj.userData.velocity.y-=5.2*dt;obj.position.addScaledVector(obj.userData.velocity,dt);obj.userData.velocity.multiplyScalar(Math.pow(.985,dt*60));if(obj.position.y<.34){obj.position.y=.34;if(Math.abs(obj.userData.velocity.y)>.35)obj.userData.velocity.y=Math.abs(obj.userData.velocity.y)*.32;else obj.userData.velocity.y=0;obj.userData.velocity.x*=.82;obj.userData.velocity.z*=.82}}}checkPuzzle();}
function checkPuzzle(){if(!puzzleRevealed||puzzleSolved||!puzzleCube||held.size)return;const v=puzzleCube.userData.velocity||new THREE.Vector3();if(puzzleCube.position.distanceTo(new THREE.Vector3(0,.71,-3.65))<.48&&v.length()<1.65){puzzleSolved=true;puzzleCube.position.set(0,.71,-3.65);puzzleCube.rotation.set(0,0,0);puzzleCube.userData.velocity.set(0,0,0);puzzleCube.userData.locked=true;puzzleSocket.children[0].material.color.set(0x67ffae);puzzleSocket.children[0].material.emissive.set(0x1d9c62);say('Wait. You actually did it? The cube goes in the cube place? That is annoyingly correct.');const solved=textPanel('PUZZLE COMPLETE',2.6,.42,76,'#8affc4');solved.position.set(0,1.75,-3.65);scene.add(solved);}}
function frame(t){const dt=Math.min(.04,(t-lastTime)/1000);lastTime=t;updateHeldMotion(dt);updatePhysics(dt);renderer.render(scene,camera)}
async function startVR(){try{if(!navigator.xr)throw new Error('WebXR is not available in this browser. Open this page in Quest Browser.');status.textContent='Starting immersive VR…';session=await navigator.xr.requestSession('immersive-vr',{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking']});renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');document.body.appendChild(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,40);camera.position.set(0,1.65,0);scene.add(camera);addRoom();addTitle();initControllers();await renderer.xr.setSession(session);menu.style.display='none';started=true;say('Welcome. There is no game. So please stop looking for one.');renderer.setAnimationLoop(frame);session.addEventListener('end',()=>location.reload())}catch(e){status.textContent=e.name+': '+e.message}}
enter.addEventListener('click',startVR);
if(navigator.xr){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{enter.disabled=!ok;status.textContent=ok?'Immersive VR ready.':'This browser does not report immersive VR support.'}).catch(e=>status.textContent=e.message)}else{enter.disabled=true;status.textContent='WebXR unavailable. Open in Meta Quest Browser over HTTPS.'}
addEventListener('resize',()=>{if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
</script></body></html>
