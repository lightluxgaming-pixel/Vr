<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Hand Grab Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui}#c{position:fixed;inset:0;width:100%;height:100%}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#111;z-index:2}#p{padding:30px}button{padding:18px 28px;border:0;border-radius:14px;font-size:18px;font-weight:800}</style></head><body><canvas id="c"></canvas><div id="menu"><div id="p"><h1>Hand Grab Test</h1><p>Passthrough + hand outline + pinch grab.</p><button id="go">ENTER XR</button><div id="s">Checking…</div></div></div><script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script><script>'use strict';const canvas=document.getElementById('c'),menu=document.getElementById('menu'),go=document.getElementById('go'),status=document.getElementById('s');let session,space,gl,layer,prog,posBuf,colorLoc,mvpLoc,boxPos=[0,1.35,-1.2],grab=null;const chains=[['wrist','thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip'],['wrist','index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip'],['wrist','middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip'],['wrist','ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip'],['wrist','pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip']];go.onclick=start;(async()=>{try{const ok=!!navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar');status.textContent=ok?'Ready':'immersive-ar unavailable';go.disabled=!ok}catch(e){status.textContent=e.message;go.disabled=true}})();function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}function start(){return navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking']}).then(async s=>{session=s;gl=canvas.getContext('webgl',{alpha:true,antialias:true,depth:true});await gl.makeXRCompatible();layer=new XRWebGLLayer(session,gl,{alpha:true});session.updateRenderState({baseLayer:layer});space=await session.requestReferenceSpace('local-floor');const vs=sh(gl.VERTEX_SHADER,'attribute vec3 p;uniform mat4 mvp;void main(){gl_Position=mvp*vec4(p,1.0);}'),fs=sh(gl.FRAGMENT_SHADER,'precision mediump float;uniform vec4 color;void main(){gl_FragColor=color;}');prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));posBuf=gl.createBuffer();colorLoc=gl.getUniformLocation(prog,'color');mvpLoc=gl.getUniformLocation(prog,'mvp');menu.style.display='none';session.requestAnimationFrame(frame)}).catch(e=>{menu.style.display='grid';status.textContent=e.name+': '+e.message});}function draw(view,verts,mode,color){gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STREAM_DRAW);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);const m=glMatrix.mat4.create();glMatrix.mat4.multiply(m,view.projectionMatrix,view.transform.inverse.matrix);gl.uniformMatrix4fv(mvpLoc,false,m);gl.uniform4f(colorLoc,color[0],color[1],color[2],color[3]);gl.drawArrays(mode,0,verts.length/3)}function line(view,a,b,color){draw(view,[a.x,a.y,a.z,b.x,b.y,b.z],gl.LINES,color)}function cube(view){const [x,y,z]=boxPos,h=.15,v=[x-h,y-h,z-h,x+h,y-h,z-h,x+h,y+h,z-h,x-h,y+h,z-h,x-h,y-h,z+h,x+h,y-h,z+h,x+h,y+h,z+h,x-h,y+h,z+h],e=[0,1,1,2,2,3,3,0,4,5,5,6,6,7,7,4,0,4,1,5,2,6,3,7],out=[];for(const i of e)out.push(...v.slice(i*3,i*3+3));draw(view,out,gl.LINES,grab?[1,.75,.05,1]:[.3,.85,1,1])}function pt(p){return p.transform.position}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z)}function frame(t,f){try{const pose=f.getViewerPose(space);if(pose){gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);for(const view of pose.views){const vp=layer.getViewport(view);gl.viewport(vp.x,vp.y,vp.width,vp.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(prog);cube(view);for(const src of session.inputSources){if(!src.hand)continue;for(const chain of chains){for(let i=1;i<chain.length;i++){const a=f.getJointPose(src.hand.get(chain[i-1]),space),b=f.getJointPose(src.hand.get(chain[i]),space);if(a&&b)line(view,pt(a),pt(b),[.2,1,1,1])}}const tp=f.getJointPose(src.hand.get('thumb-tip'),space),ip=f.getJointPose(src.hand.get('index-finger-tip'),space);if(tp&&ip){const a=pt(tp),b=pt(ip),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:(a.z+b.z)/2},pinch=d(a,b)<.045;if(pinch&&!grab&&d(mid,{x:boxPos[0],y:boxPos[1],z:boxPos[2]})<.35)grab={src,off:[boxPos[0]-mid.x,boxPos[1]-mid.y,boxPos[2]-mid.z]};if(grab&&grab.src===src){if(pinch)boxPos=[mid.x+grab.off[0],mid.y+grab.off[1],mid.z+grab.off[2]];else grab=null}}}}}}catch(e){console.error(e)}session.requestAnimationFrame(frame)}</script></body></html>
