<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Render Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#111;z-index:2}#p{padding:30px}button{padding:18px 28px;border:0;border-radius:14px;font-size:18px;font-weight:800}</style></head><body><div id="menu"><div id="p"><h1>XR Render Test</h1><p>First we verify that Quest can see a WebGL object in passthrough.</p><button id="go">ENTER XR</button><div id="s">Checking…</div></div></div><script>'use strict';const menu=document.getElementById('menu'),go=document.getElementById('go'),s=document.getElementById('s');let session,space,gl,layer,prog,pbuf,cb,u;go.onclick=start;(async()=>{try{let ok=await navigator.xr.isSessionSupported('immersive-ar');s.textContent=ok?'Ready':'immersive-ar unavailable';go.disabled=!ok}catch(e){s.textContent=e.message;go.disabled=true}})();async function start(){try{session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor']});gl=document.createElement('canvas').getContext('webgl',{alpha:true,antialias:true});await gl.makeXRCompatible();layer=new XRWebGLLayer(session,gl);session.updateRenderState({baseLayer:layer});space=await session.requestReferenceSpace('local-floor');let vs=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(vs,'attribute vec3 p;uniform mat4 m;void main(){gl_Position=m*vec4(p,1.0);}');gl.compileShader(vs);let fs=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(fs,'precision mediump float;uniform vec4 color;void main(){gl_FragColor=color;}');gl.compileShader(fs);prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);pbuf=gl.createBuffer();cb=gl.getUniformLocation(prog,'color');u=gl.getUniformLocation(prog,'m');menu.style.display='none';session.requestAnimationFrame(frame)}catch(e){s.textContent=e.name+': '+e.message}}function frame(t,f){let pose=f.getViewerPose(space);if(pose){gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);for(const v of pose.views){let x=v.viewport;gl.viewport(x.x,x.y,x.width,x.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(prog);let m=new Float32Array(16);for(let i=0;i<16;i++)m[i]=v.projectionMatrix[i];gl.uniformMatrix4fv(u,false,m);gl.bindBuffer(gl.ARRAY_BUFFER,pbuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-.55,-.55,-1,.55,-.55,-1,0,.55,-1]),gl.STREAM_DRAW);let a=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);gl.uniform4f(cb,0.05,0.8,1,1);gl.drawArrays(gl.TRIANGLES,0,3)}}session.requestAnimationFrame(frame)}</script></body></html>
