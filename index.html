<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VR House Sandbox</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;color:#fff;font-family:system-ui,sans-serif}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#101318;z-index:10}#panel{max-width:560px;padding:32px}h1{font-size:42px;margin:0 0 10px}p{opacity:.75;line-height:1.5}button{border:0;border-radius:16px;padding:18px 28px;background:#fff;color:#111;font-size:18px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#status{margin-top:18px;min-height:24px}#error{margin-top:12px;color:#ff8c8c;white-space:pre-wrap;font-size:14px}
</style>
</head>
<body>
<div id="menu"><div id="panel"><h1>VR House Sandbox</h1><p>Stand normally on the floor, then press START GAME. Quest's floor-tracking system will be used for the game floor.</p><button id="startBtn">START GAME</button><div id="status">Ready.</div><div id="error"></div></div></div>
<script>
'use strict';
const menu=document.getElementById('menu');
const button=document.getElementById('startBtn');
const status=document.getElementById('status');
const errorBox=document.getElementById('error');
let session=null,refSpace=null,gl=null,layer=null,program=null;
let positionBuffer=null,colorBuffer=null,uVP=null;
let vertexData=null,colorData=null,vertexCount=0;

button.addEventListener('click',startGame);
function setStatus(t){status.textContent=t}
function showError(t){errorBox.textContent=t||''}

async function startGame(){
 button.disabled=true;showError('');
 if(!navigator.xr){setStatus('WebXR is not available. Open this in Meta Quest Browser.');button.disabled=false;return}
 try{
  setStatus('Starting VR and requesting floor tracking…');
  // local-floor is required so we never silently fall back to a headset-origin space.
  session=await navigator.xr.requestSession('immersive-vr',{requiredFeatures:['local-floor'],optionalFeatures:['bounded-floor']});
  const canvas=document.createElement('canvas');
  gl=canvas.getContext('webgl',{alpha:false,antialias:false,powerPreference:'low-power'});
  if(!gl)throw new Error('WebGL is unavailable.');
  await gl.makeXRCompatible();
  layer=new XRWebGLLayer(session,gl,{antialias:false});
  session.updateRenderState({baseLayer:layer});
  refSpace=await session.requestReferenceSpace('local-floor');
  setStatus('Floor tracking ready. Starting room…');
  setupRenderer();
  buildRoom();
  menu.style.display='none';
  session.addEventListener('end',onSessionEnd);
  session.requestAnimationFrame(onXRFrame);
 }catch(e){
  console.error(e);
  setStatus('VR setup failed.');
  showError((e&&e.name?e.name+': ':'')+(e&&e.message?e.message:'Unknown error')+'\n\nIf Quest has not completed its room/floor setup, finish that in the headset first.');
  button.disabled=false;
  if(session){try{await session.end()}catch(_){}session=null}
 }
}

function compile(type,source){
 const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'Shader compile failed.');
 return s;
}
function setupRenderer(){
 const vs=compile(gl.VERTEX_SHADER,'attribute vec3 aPosition;attribute vec3 aColor;uniform mat4 uVP;varying vec3 vColor;void main(){gl_Position=uVP*vec4(aPosition,1.0);vColor=aColor;}');
 const fs=compile(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 vColor;void main(){gl_FragColor=vec4(vColor,1.0);}');
 program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'Shader link failed.');
 gl.deleteShader(vs);gl.deleteShader(fs);gl.useProgram(program);
 positionBuffer=gl.createBuffer();colorBuffer=gl.createBuffer();uVP=gl.getUniformLocation(program,'uVP');
 gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
}

function addBox(data,x,y,z,sx,sy,sz,color){
 const hx=sx/2,hy=sy/2,hz=sz/2;
 const p=[-hx,-hy,-hz,hx,-hy,-hz,hx,hy,-hz,-hx,-hy,-hz,hx,hy,-hz,-hx,hy,-hz,-hx,-hy,hz,-hx,hy,hz,hx,hy,hz,-hx,-hy,hz,hx,hy,hz,hx,-hy,hz,-hx,-hy,-hz,-hx,hy,-hz,-hx,hy,hz,-hx,-hy,-hz,-hx,hy,hz,-hx,-hy,hz,hx,-hy,-hz,hx,-hy,hz,hx,hy,hz,hx,-hy,-hz,hx,hy,hz,hx,hy,-hz,-hx,hy,-hz,hx,hy,-hz,hx,hy,hz,-hx,hy,-hz,hx,hy,hz,-hx,hy,hz,-hx,-hy,-hz,-hx,-hy,hz,hx,-hy,hz,-hx,-hy,-hz,hx,-hy,hz,hx,-hy,-hz];
 for(let i=0;i<p.length;i+=3){data.p.push(p[i]+x,p[i+1]+y,p[i+2]+z);data.c.push(color[0],color[1],color[2])}
}
function buildRoom(){
 const data={p:[],c:[]};
 addBox(data,0,-.05,0,6,.1,6,[.28,.31,.35]);
 addBox(data,0,1.5,-3,6,3,.1,[.48,.50,.54]);
 addBox(data,-3,1.5,0,.1,3,6,[.42,.44,.48]);
 addBox(data,3,1.5,0,.1,3,6,[.42,.44,.48]);
 addBox(data,0,3,0,6,.1,6,[.34,.36,.40]);
 addBox(data,0,1,-1,2,.12,1.2,[.38,.22,.12]);
 for(const x of[-.85,.85])for(const z of[-1.45,-.55])addBox(data,x,.5,z,.12,1,.12,[.25,.14,.08]);
 vertexData=new Float32Array(data.p);colorData=new Float32Array(data.c);vertexCount=vertexData.length/3;
 gl.bindBuffer(gl.ARRAY_BUFFER,positionBuffer);gl.bufferData(gl.ARRAY_BUFFER,vertexData,gl.STATIC_DRAW);
 gl.bindBuffer(gl.ARRAY_BUFFER,colorBuffer);gl.bufferData(gl.ARRAY_BUFFER,colorData,gl.STATIC_DRAW);
}
function onXRFrame(time,frame){
 const pose=frame.getViewerPose(refSpace);
 if(pose){
  gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);
  gl.clearColor(.055,.07,.09,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.bindBuffer(gl.ARRAY_BUFFER,positionBuffer);const ap=gl.getAttribLocation(program,'aPosition');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,colorBuffer);const ac=gl.getAttribLocation(program,'aColor');gl.enableVertexAttribArray(ac);gl.vertexAttribPointer(ac,3,gl.FLOAT,false,0,0);
  for(const view of pose.views){
   const v=layer.getViewport(view);gl.viewport(v.x,v.y,v.width,v.height);gl.clear(gl.DEPTH_BUFFER_BIT);
   gl.uniformMatrix4fv(uVP,false,multiply4(view.projectionMatrix,view.transform.inverse.matrix));
   gl.drawArrays(gl.TRIANGLES,0,vertexCount);
  }
 }
 frame.session.requestAnimationFrame(onXRFrame);
}
function multiply4(a,b){
 const o=new Float32Array(16);
 for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
 return o;
}
function onSessionEnd(){session=null;menu.style.display='grid';button.disabled=false;setStatus('Game ended. Press START GAME to play again.');showError('')}
</script>
</body>
</html>
