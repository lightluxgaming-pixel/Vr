<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOWN//HOUSE XR Sandbox</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui;color:#fff}canvas{display:block}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#090a0d;z-index:20;text-align:center}#card{max-width:720px;padding:30px}button{font-size:20px;font-weight:900;padding:15px 25px;border:0;border-radius:12px}#status{opacity:.75;line-height:1.5}#hud{position:fixed;top:14px;left:14px;z-index:5;font-weight:900;text-shadow:0 2px 8px #000;pointer-events:none}.ok{color:#72ff9b}</style></head><body><div id="menu"><div id="card"><h1>DOWN//HOUSE</h1><h3>SPACE SETUP XR SANDBOX</h3><p>Your Quest room is the play space. No Guardian boundary is used as the game map.</p><button id="start">ENTER SANDBOX</button><p id="status">Checking immersive AR…</p></div></div><div id="hud">SANDBOX</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const start=document.querySelector('#start'),status=document.querySelector('#status'),hud=document.querySelector('#hud');
let renderer,scene,camera,session,refSpace,viewerSpace,hitSource=null;let inputs=[];let selected=0;let watch,watchButtons=[];let spawned=[];let roomPlanes=[];let last=performance.now();let floorY=0;const raycaster=new THREE.Raycaster();
const ITEMS=['PISTOL','SMG','SHOTGUN','RIFLE','REVOLVER','BLADE','CRATE','BARREL','BALL','DUMMY'];
const colors=[0x454a52,0x39414a,0x5b4030,0x30363d,0x555a60,0xbfc5cc,0x8b5a32,0x59616a,0xc33a43,0x66717d];
function mat(c,rough=.65,metal=.1){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
function box(x,y,z,c){return new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat(c))}
function cyl(r,h,c){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),mat(c,.45,.25))}
function gun(name){let g=new THREE.Group();g.userData.item=name;let body=box(.09,.13,name==='SHOTGUN'?.40:.30,colors[ITEMS.indexOf(name)]);body.position.z=-.08;g.add(body);let grip=box(.065,.20,.09,0x151719);grip.position.set(0,-.12,.02);grip.rotation.x=-.16;g.add(grip);let barrel=cyl(name==='SHOTGUN'?.045:.025,name==='RIFLE'?.52:name==='SHOTGUN'?.42:.25,0x111315);barrel.rotation.x=Math.PI/2;barrel.position.z=name==='RIFLE'?.48:name==='SHOTGUN'?.34:.25;g.add(barrel);if(name==='REVOLVER'){let d=cyl(.065,.07,0x66696d,12);d.rotation.z=Math.PI/2;g.add(d)}return g}
function makeItem(name){if(name==='BLADE'){let g=new THREE.Group();g.userData.item=name;g.add(box(.07,.08,.18,0x25282b));let b=box(.055,.035,.52,0xd5d9de);b.position.z=.42;g.add(b);return g}if(name==='CRATE')return box(.32,.32,.32,colors[6]);if(name==='BARREL')return cyl(.17,.42,colors[7]);if(name==='BALL')return new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),mat(colors[8],.4));if(name==='DUMMY'){let g=new THREE.Group();g.userData.item=name;let t=box(.28,.48,.18,0x626a73);t.position.y=.67;g.add(t);let h=new THREE.Mesh(new THREE.SphereGeometry(.15,12,8),mat(0x9a765c));h.position.y=1.03;g.add(h);return g}return gun(name)}
function buildWatch(){watch=new THREE.Group();watch.position.set(.12,-.035,.03);watch.rotation.set(-.15,0,0);let strap=box(.11,.28,.035,0x181a1e);strap.position.y=.0;watch.add(strap);let face=box(.19,.18,.045,0x080a0d);face.position.z=.035;watch.add(face);let screen=box(.175,.165,.012,0x07161a);screen.position.z=.062;watch.add(screen);let title=makeText('SPAWNER',.035);title.position.set(-.065,.06,.072);watch.add(title);let label=makeText('',.027);label.name='label';label.position.set(-.065,.018,.072);watch.add(label);let left=makeButton('<',-.065,-.045);let right=makeButton('>',.065,-.045);watchButtons=[left,right];watch.add(left,right);let spawn=makeButton('SPAWN',0,-.085);spawn.scale.set(1.15,.65,1);watchButtons.push(spawn);watch.add(spawn);return watch}
function makeButton(text,x,y){let b=box(.055,.038,.018,0x26343a);b.position.set(x,y,.07);b.userData.button=text;let t=makeText(text,.022);t.position.set(-.025,-.01,.011);b.add(t);return b}
function makeText(text,size){let c=document.createElement('canvas');c.width=256;c.height=64;let x=c.getContext('2d');x.fillStyle='white';x.font='bold 42px sans-serif';x.fillText(text,8,45);let tx=new THREE.CanvasTexture(c);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true}));s.scale.set(size*4,size,1);return s}
function attachWatch(){let left=renderer.xr.getControllerGrip(0);left.add(buildWatch())}
function setupInput(){for(let i=0;i<2;i++){let c=renderer.xr.getController(i),g=renderer.xr.getControllerGrip(i);scene.add(c,g);c.userData.index=i;c.addEventListener('connected',e=>{c.userData.source=e.data});c.addEventListener('selectstart',()=>onSelect(c));c.addEventListener('squeezestart',()=>onSqueeze(c));let ray=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:i?0x55aaff:0xff6688}));ray.scale.z=3; c.add(ray);inputs.push({c,g})}attachWatch()}
function cycle(n){selected=(selected+n+ITEMS.length)%ITEMS.length;updateWatch();}
function updateWatch(){if(!watch)return;let l=watch.getObjectByName('label');if(l){l.material.map.dispose();l.material.map=makeText(ITEMS[selected],.027).material.map;l.material.needsUpdate=true}}
function onSqueeze(c){if(c.userData.index===1)cycle(1)}
function onSelect(c){if(c.userData.index===0){cycle(1);return}let hits=raycaster.intersectObjects(watchButtons,true);if(hits.length){let b=hits[0].object;while(b&&!b.userData.button)b=b.parent;if(b){if(b.userData.button==='<')cycle(-1);else if(b.userData.button==='>')cycle(1);else if(b.userData.button==='SPAWN'){spawnAtRay(c)}}return}spawnAtRay(c)}
function spawnAtRay(c){let p=new THREE.Vector3(),q=new THREE.Quaternion();c.getWorldPosition(p);c.getWorldQuaternion(q);let d=new THREE.Vector3(0,0,-1).applyQuaternion(q).normalize();let pos=p.clone().addScaledVector(d,1.0);let hit=findRoomHit(p,d);if(hit)pos.copy(hit);pos.y=Math.max(pos.y,floorY+.15);let o=makeItem(ITEMS[selected]);o.position.copy(pos);o.userData.vel=new THREE.Vector3();o.userData.grabbable=true;scene.add(o);spawned.push(o);hud.textContent='SPAWNED '+ITEMS[selected]+' • WATCH: LEFT WRIST';}
function findRoomHit(origin,dir){let best=null,bd=8;for(let pl of roomPlanes){let n=pl.normal;let den=n.dot(dir);if(Math.abs(den)<.0001)continue;let t=n.dot(pl.point.clone().sub(origin))/den;if(t>0&&t<bd){best=origin.clone().addScaledVector(dir,t);bd=t}}return best}
function scanRoom(frame){roomPlanes=[];if(!frame.detectedPlanes)return;for(const pl of frame.detectedPlanes){const pose=frame.getPose(pl.planeSpace,refSpace);if(!pose)continue;let n=new THREE.Vector3(0,1,0).applyQuaternion(new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().fromArray(pose.transform.matrix))).normalize();let point=new THREE.Vector3(pose.transform.position.x,pose.transform.position.y,pose.transform.position.z);roomPlanes.push({normal:n,point});if(pl.orientation==='horizontal'&&Math.abs(point.y)<.2)floorY=point.y}hud.textContent='SPACE SETUP • '+roomPlanes.length+' PLANES • '+ITEMS[selected]}
function animatePhysics(dt){for(const o of spawned){if(o.userData.held)continue;if(o.userData.vel){o.userData.vel.y-=4.5*dt;o.position.addScaledVector(o.userData.vel,dt);if(o.position.y<floorY+.12){o.position.y=floorY+.12;o.userData.vel.y*=-.3;o.userData.vel.x*=.8;o.userData.vel.z*=.8}o.userData.vel.multiplyScalar(.96)}}}
function render(t,frame){let dt=Math.min(.05,(t-last)/1000);last=t;if(frame){scanRoom(frame);animatePhysics(dt)}renderer.render(scene,camera)}
async function enter(){try{status.textContent='Opening Quest passthrough…';session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor'],optionalFeatures:['plane-detection','mesh-detection','hand-tracking','hit-test']});renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');document.body.appendChild(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,30);scene.add(new THREE.HemisphereLight(0xffffff,0x333344,2));let light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,4,1);scene.add(light);refSpace=await session.requestReferenceSpace('local-floor');viewerSpace=await session.requestReferenceSpace('viewer');await renderer.xr.setSession(session);setupInput();menu.style.display='none';session.addEventListener('inputsourceschange',()=>hud.textContent='XR INPUTS '+session.inputSources.length+' • '+ITEMS[selected]);renderer.setAnimationLoop(render);session.addEventListener('end',()=>location.reload());status.textContent=''}catch(e){status.textContent=e.name+': '+e.message}}
start.onclick=enter;if(navigator.xr)navigator.xr.isSessionSupported('immersive-ar').then(ok=>{start.disabled=!ok;status.textContent=ok?'Quest immersive AR ready':'immersive-ar unavailable'});else{start.disabled=true;status.textContent='WebXR unavailable'}
addEventListener('resize',()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
</script></body></html>
